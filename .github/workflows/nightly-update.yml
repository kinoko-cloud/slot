name: Nightly Update

on:
  schedule:
    # 毎日 JST 23:00 = UTC 14:00 (閉店後の速報)
    - cron: '0 14 * * *'
    # 毎日 JST 8:00 = UTC 23:00 (前日データ確定版)
    # DAIDATAは翌朝にならないと前日の詳細履歴が取れない
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: slot-nightly-update
  cancel-in-progress: false

jobs:
  nightly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install 'playwright==1.49.1' flask jinja2 requests pytz
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch latest data (final scrape of the day)
        timeout-minutes: 20
        env:
          # Playwrightのパイプエラーを回避
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: |
          # v2スクレイパー（店舗ごとに実行して1つ失敗しても他は成功するように）
          echo "=== SBJ店舗取得 ==="
          timeout 180 python scripts/scrapers_v2/fetch_all.py --sbj-only --daidata-only 2>&1 || echo "⚠️ SBJ daidata failed"
          
          sleep 3
          
          echo "=== 真打吉宗・ToLOVEる店舗取得（1店舗ずつ）==="
          for store in shinjuku_espass_yoshimune akiba_espass_yoshimune seibu_shinjuku_espass_yoshimune shibuya_espass_yoshimune shinjuku_espass_toloveru akiba_espass_toloveru seibu_shinjuku_espass_toloveru shibuya_espass_toloveru; do
            echo "--- $store ---"
            sleep 3
            timeout 120 python scripts/scrapers_v2/fetch_all.py --store $store 2>&1 || echo "⚠️ $store failed"
          done
          
          sleep 3
          echo "=== papimo取得 ==="
          timeout 600 python scripts/scrapers_v2/fetch_all.py --papimo-only 2>&1 || echo "⚠️ papimo failed"

      - name: Sync availability to history (確定データ移行)
        run: |
          python scripts/sync_realtime_to_history.py

      - name: Fetch detailed history (batch_update)
        timeout-minutes: 20
        continue-on-error: true
        run: |
          echo "📊 Fetching detailed history data..."
          # 前日のデータを取得
          YESTERDAY=$(TZ='Asia/Tokyo' date -d 'yesterday' +'%Y-%m-%d')
          
          # リトライ付きで実行
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Attempt $attempt / $MAX_ATTEMPTS ==="
            if timeout 600 python scripts/batch_update_history.py --target-date $YESTERDAY; then
              echo "✅ Batch update succeeded"
              break
            else
              echo "❌ Batch update failed on attempt $attempt"
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
          done

      - name: Verify history completeness
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          
          JST = timezone(timedelta(hours=9))
          yesterday = (datetime.now(JST) - timedelta(days=1)).strftime('%Y-%m-%d')
          
          issues = []
          checked = 0
          
          for store_dir in Path('data/history').iterdir():
              if not store_dir.is_dir():
                  continue
              for unit_file in list(store_dir.glob('*.json'))[:3]:
                  try:
                      data = json.load(open(unit_file))
                      for day in data.get('days', []):
                          if day.get('date') == yesterday:
                              hist = day.get('history', [])
                              if hist:
                                  last_time = hist[-1].get('time', '')
                                  checked += 1
                                  if last_time and last_time < '20:00':
                                      issues.append(f"{store_dir.name}/{unit_file.stem}: {last_time}")
                              break
                  except:
                      pass
          
          print(f"Checked: {checked} units")
          if issues:
              print(f"⚠️ {len(issues)} units have incomplete data:")
              for issue in issues[:10]:
                  print(f"  {issue}")
          else:
              print("✅ All history data complete")
          EOF

      - name: Generate static site
        run: |
          python scripts/generate_static.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add data/history/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M')
          git commit -m "auto: 夜間更新 ${TIMESTAMP}"

          for i in 1 2 3; do
            git pull origin main --no-rebase -X ours 2>/dev/null || true
            if git push origin main; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 5
          done
          exit 0
