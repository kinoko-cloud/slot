name: Nightly Update

on:
  schedule:
    # 毎日 JST 23:00 = UTC 14:00
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: slot-nightly-update
  cancel-in-progress: false

jobs:
  nightly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install 'playwright==1.49.1' flask jinja2 requests
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch latest data (final scrape of the day)
        timeout-minutes: 15
        run: |
          python scripts/fetch_daidata_availability.py || echo "⚠️ Fetch failed (will use existing data)"

      - name: Sync availability to history (確定データ移行)
        run: |
          python scripts/sync_realtime_to_history.py

      - name: Generate static site
        run: |
          python scripts/generate_static.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add data/history/ docs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M')
          git commit -m "auto: 夜間更新 ${TIMESTAMP}"

          for i in 1 2 3; do
            git pull origin main --no-rebase -X ours 2>/dev/null || true
            if git push origin main; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 5
          done
          exit 0
