name: Test VPN Gate Access to daidata

on:
  workflow_dispatch:

jobs:
  test-vpngate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Test direct daidata access (should be 403)
        run: |
          echo "=== Direct access (GitHub Actions IP) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://daidata.goraggio.com/100949/unit_list?model=225010000&ballPrice=21.70&ps=S" 2>&1)
          echo "HTTP status: $CODE"
          MY_IP=$(curl -s --max-time 5 "https://ipinfo.io/ip")
          ORG=$(curl -s --max-time 5 "https://ipinfo.io/org")
          echo "My IP: $MY_IP | $ORG"

      - name: Install OpenVPN
        run: |
          sudo apt-get install -y openvpn 2>&1 | tail -3

      - name: Fetch VPN Gate JP server list and prepare configs
        run: |
          python3 << 'EOF'
          import urllib.request
          import base64
          import os

          url = "https://www.vpngate.net/api/iphone/"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", errors="ignore")

          rows = []
          for line in data.strip().split("\n"):
              if line.startswith("#") or not line.strip():
                  continue
              parts = line.split(",")
              if len(parts) < 15 or parts[6] != "JP":
                  continue
              try:
                  score = int(parts[2])
                  ip = parts[1]
                  config = base64.b64decode(parts[14]).decode("utf-8", errors="ignore")
                  # Fix cipher negotiation for OpenVPN 2.5+
                  config += "\ndata-ciphers AES-128-CBC:AES-256-GCM:AES-128-GCM\n"
                  rows.append((score, ip, config))
              except Exception:
                  continue

          rows.sort(key=lambda x: -x[0])
          print(f"Found {len(rows)} JP servers")

          for i, (score, ip, config) in enumerate(rows[:3]):
              print(f"Server #{i+1}: {ip} (score: {score})")
              with open(f"/tmp/vpngate_{i}.ovpn", "w") as f:
                  f.write(config)
          EOF

      - name: Connect to VPN Gate and test daidata
        run: |
          CONNECTED=false
          for i in 0 1 2; do
            OVPN="/tmp/vpngate_${i}.ovpn"
            [ -f "$OVPN" ] || continue

            SERVER_IP=$(grep "^remote " "$OVPN" | head -1 | awk '{print $2}')
            echo "=== Trying VPN Gate server: $SERVER_IP ==="

            sudo rm -f /tmp/vpn.log
            sudo openvpn --config "$OVPN" --daemon --log /tmp/vpn.log --script-security 2

            for t in $(seq 1 6); do
              sleep 5
              if ip link show tun0 2>/dev/null | grep -q "tun0"; then
                echo "✓ TUN interface appeared after ${t}×5s"
                CONNECTED=true
                break
              fi
              LAST_LOG=$(sudo tail -3 /tmp/vpn.log 2>/dev/null || echo "")
              echo "  t=${t}: $LAST_LOG"
            done

            $CONNECTED && break
            echo "Connection failed for $SERVER_IP, trying next..."
            sudo killall openvpn 2>/dev/null || true
            sleep 2
          done

          echo ""
          echo "=== VPN connection log (last 20 lines) ==="
          sudo tail -20 /tmp/vpn.log 2>/dev/null || true

          echo ""
          echo "=== Network state ==="
          ip route show 2>&1 | head -10
          echo "Current IP:"
          curl -s --max-time 10 "https://ipinfo.io/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print('IP:', d.get('ip'), '| Org:', d.get('org'), '| Country:', d.get('country'))"

          echo ""
          echo "=== Test daidata access ==="
          CODE=$(curl -s -o /tmp/daidata_resp.txt -w "%{http_code}" --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://daidata.goraggio.com/100949/unit_list?model=225010000&ballPrice=21.70&ps=S")
          echo "HTTP status: $CODE"

          if [ "$CODE" = "302" ]; then
            echo "✅ SUCCESS: VPN Gate bypasses CloudFront WAF!"
          elif [ "$CODE" = "403" ]; then
            if $CONNECTED; then
              echo "❌ BLOCKED: VPN connected but CloudFront still blocks VPN Gate IPs."
              echo "→ CloudFront WAF blocks non-residential IPs, not just AWS. Proxy approach won't work."
            else
              echo "❌ VPN connection failed. Test inconclusive."
              echo "→ Need to investigate OpenVPN connection issues."
            fi
            head -5 /tmp/daidata_resp.txt || true
          else
            echo "⚠️ HTTP $CODE (unexpected)"
          fi
