name: Deploy Static Site

on:
  # 手動実行
  workflow_dispatch:

  # availability.jsonが更新されたら実行
  push:
    branches:
      - main
    paths:
      - 'data/availability.json'
      - 'data/daily/**'

  # 定期実行: 毎時5分と35分（バックアップ）
  # データが古い場合は先にfetchを実行
  schedule:
    - cron: '5 1-13 * * *'   # 毎時5分（JST 10:05-22:05）
    - cron: '35 1-13 * * *'  # 毎時35分（JST 10:35-22:35）
    # 日付変更後に再生成（的中率の日付更新のため）
    - cron: '5 15 * * *'     # JST 0:05（日付変更直後）
    - cron: '30 15 * * *'    # JST 0:30（バックアップ）

concurrency:
  group: slot-deploy-static
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask jinja2 requests

      - name: Check data freshness and fetch if needed
        id: check_data
        env:
          TZ: Asia/Tokyo
        run: |
          python3 << 'EOF'
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          
          # 営業時間チェック（10:00-22:45 JST）
          is_business_hours = 10 <= now.hour < 23
          
          # availability.jsonの更新時刻を確認
          avail_path = Path('data/availability.json')
          if not avail_path.exists():
              print("NEEDS_FETCH=true")
              sys.exit(0)
          
          with open(avail_path) as f:
              data = json.load(f)
          
          fetched_at = data.get('fetched_at', '')
          if not fetched_at:
              print("NEEDS_FETCH=true")
              sys.exit(0)
          
          fetched_time = datetime.fromisoformat(fetched_at)
          age_minutes = (now - fetched_time).total_seconds() / 60
          print(f"Data age: {age_minutes:.0f} minutes")
          
          # 営業時間中で45分以上古い場合は再取得
          if is_business_hours and age_minutes > 45:
              print("NEEDS_FETCH=true")
          else:
              print("NEEDS_FETCH=false")
          EOF

          # 結果を取得
          if python3 -c "
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          is_business_hours = 10 <= now.hour < 23

          avail_path = Path('data/availability.json')
          if not avail_path.exists():
              exit(0)

          with open(avail_path) as f:
              data = json.load(f)
          
          fetched_at = data.get('fetched_at', '')
          if not fetched_at:
              exit(0)
          
          fetched_time = datetime.fromisoformat(fetched_at)
          age_minutes = (now - fetched_time).total_seconds() / 60
          
          if is_business_hours and age_minutes > 45:
              exit(0)
          else:
              exit(1)
          "; then
            echo "needs_fetch=true" >> $GITHUB_OUTPUT
          else
            echo "needs_fetch=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright (if fetch needed)
        if: steps.check_data.outputs.needs_fetch == 'true'
        run: |
          pip install 'playwright==1.49.1'
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch fresh data
        if: steps.check_data.outputs.needs_fetch == 'true'
        run: |
          echo "🔄 Data is stale, fetching fresh data..."
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt / 3 ==="
            if timeout 300 python scripts/fetch_daidata_availability.py; then
              echo "✅ Fetch succeeded"
              break
            else
              echo "❌ Fetch failed"
              if [ $attempt -lt 3 ]; then
                sleep 20
              fi
            fi
          done

      - name: Generate static site
        run: |
          python scripts/generate_static.py

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ data/
          git diff --staged --quiet || git commit -m "chore: update static site $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M')"
          
          for i in 1 2 3 4 5; do
            # Fetch latest and try rebase
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "✅ Push succeeded (attempt $i)"
                exit 0
              fi
            else
              echo "⚠️ Rebase conflict detected, aborting and resetting to remote..."
              git rebase --abort || true
              git reset --hard origin/main
              echo "Reset to origin/main. Local changes discarded (will regenerate on next run)."
              exit 0  # Exit gracefully, next scheduled run will regenerate
            fi
            echo "Push failed (attempt $i/5), retrying..."
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1

  # GitHub Pages へのデプロイ
  deploy-github-pages:
    needs: generate-and-deploy
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
