name: Fetch Availability (Parallel)

on:
  schedule:
    # メインデータ取得: 毎時0分と30分実行（JST 10-22時）
    # GitHub Actionsのスケジュール遅延対策で頻度を上げる
    - cron: '0 1-13 * * *'   # 毎時0分
    - cron: '30 1-13 * * *'  # 毎時30分
  workflow_dispatch:

concurrency:
  group: slot-fetch-parallel-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ステップ1: 店舗ごとに並列でデータ取得
  fetch-stores:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    strategy:
      max-parallel: 18  # 全店舗同時実行（エスパス16 + アイランド2）
      fail-fast: false  # 1店舗が失敗しても他は続行
      matrix:
        store:
          # エスパス系（DaiData）
          - shibuya_espass_sbj
          - shinjuku_espass_sbj
          - akiba_espass_sbj
          - seibu_shinjuku_espass_sbj
          - ueno_espass_sbj
          - ueno_honkan_espass_sbj
          - takadanobaba_espass_sbj
          - akasaka_espass_sbj
          - shinokubo_espass_sbj
          - shinkoiwa_espass_sbj
          - shibuya_honkan_espass_sbj
          - shibuya_espass_hokuto
          - shinjuku_espass_hokuto
          - akiba_espass_hokuto
          - seibu_shinjuku_espass_hokuto
          - shibuya_honkan_espass_hokuto
          # アイランド系（Papimo）
          - island_akihabara_sbj
          - island_akihabara_hokuto

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.49.1

      - name: Install dependencies
        run: |
          pip install 'playwright==1.49.1' requests
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch store data
        run: |
          # 店舗ごとのデータ取得スクリプト（作成予定）
          python3 scripts/fetch_single_store.py ${{ matrix.store }}

      - name: Upload store data
        uses: actions/upload-artifact@v4
        with:
          name: store-${{ matrix.store }}
          path: data/partial/${{ matrix.store }}.json
          retention-days: 1

  # ステップ2: 全店舗のデータをマージ
  merge-and-push:
    needs: fetch-stores
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all store data
        uses: actions/download-artifact@v4
        with:
          path: data/partial/

      - name: Merge store data
        run: |
          python3 scripts/merge_store_data.py

      - name: Generate static site
        run: |
          pip install jinja2 requests
          HOUR=$(TZ='Asia/Tokyo' date +'%H')
          if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 22 ]; then
            python3 scripts/generate_static.py || echo "⚠️ Static site generation failed"
          fi

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions (Parallel)"
          git config user.email "actions@github.com"

          git add data/availability.json docs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(TZ='Asia/Tokyo' date +'%H:%M')
          git commit -m "auto: 並列取得 ${TIMESTAMP}"

          for i in 1 2 3; do
            git pull origin main --no-rebase -X ours 2>/dev/null || true
            if git push origin main; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 3
          done
