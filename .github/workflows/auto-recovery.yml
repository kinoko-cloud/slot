name: Auto Recovery (Health Check + Repair)

on:
  schedule:
    # 営業時間中、30分ごとにヘルスチェック（UTC 1-13 = JST 10-22時）
    # データ取得（毎時0分）の30分後にチェックすることで、取得失敗を早期検出
    - cron: '30 1-13 * * *'  # JST 10:30-22:30、30分ごと
  workflow_dispatch:
    inputs:
      force_fetch:
        description: 'Force data fetch even if no issues detected'
        required: false
        type: boolean
        default: false

concurrency:
  group: slot-auto-recovery
  cancel-in-progress: false  # ヘルスチェックは完了させる

jobs:
  health_check_and_repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-health
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install requests jinja2

      - name: Check data freshness
        id: health_check
        env:
          TZ: Asia/Tokyo
        run: |
          python3 << 'PYEOF' > check_result.txt
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          # 営業時間チェック（10:00-22:59 JST）
          is_business_hours = 10 <= now.hour < 23

          if not is_business_hours:
              print("✅ Outside business hours, skip check")
              print("RESULT:false")
              sys.exit(0)

          # availability.jsonの更新時刻を確認
          avail_path = Path('data/availability.json')
          if not avail_path.exists():
              print("⚠️ No availability.json found")
              print("RESULT:true")
              sys.exit(0)

          with open(avail_path) as f:
              data = json.load(f)

          fetched_at = data.get('fetched_at', '')
          if not fetched_at:
              print("⚠️ No fetched_at in data")
              print("RESULT:true")
              sys.exit(0)

          fetched_time = datetime.fromisoformat(fetched_at)
          age_minutes = (now - fetched_time).total_seconds() / 60

          print(f"現在時刻: {now.strftime('%H:%M')}")
          print(f"データ取得: {fetched_time.strftime('%H:%M')}")
          print(f"経過時間: {age_minutes:.0f}分")

          # 30分以上古い場合は復旧が必要
          if age_minutes > 30:
              print(f"⚠️ Data is {age_minutes:.0f} minutes old (> 30 min)")
              print("RESULT:true")
          else:
              print("✅ Data is fresh")
              print("RESULT:false")
          PYEOF

          cat check_result.txt

          # 結果をGITHUB_OUTPUTに出力
          if grep -q "RESULT:true" check_result.txt; then
            echo "issues_found=true" >> $GITHUB_OUTPUT
            echo "⚠️ Auto-recovery needed"
          else
            echo "issues_found=false" >> $GITHUB_OUTPUT
            echo "✅ No recovery needed"
          fi

      - name: Auto recovery - Fetch data
        if: steps.health_check.outputs.issues_found == 'true' || github.event.inputs.force_fetch == 'true'
        run: |
          echo "🔧 Attempting auto-recovery by fetching fresh data..."

          # Playwrightのインストール
          pip install 'playwright==1.49.1'
          playwright install chromium
          playwright install-deps chromium

          # データ取得（リトライ付き）
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Recovery attempt $attempt / $MAX_ATTEMPTS ==="
            if timeout 300 python scripts/fetch_daidata_availability.py; then
              echo "✅ Data fetch succeeded on attempt $attempt"
              break
            else
              echo "❌ Data fetch failed on attempt $attempt"
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 20 seconds before retry..."
                sleep 20
              fi
            fi
          done

          # 成功確認
          if [ -f data/availability.json ]; then
            echo "✅ Recovery successful - data file created"
          else
            echo "❌ Recovery failed - data file not created"
            exit 1
          fi

      - name: Regenerate static site
        if: steps.health_check.outputs.issues_found == 'true' || github.event.inputs.force_fetch == 'true'
        run: |
          HOUR=$(TZ='Asia/Tokyo' date +'%H')
          if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 22 ]; then
            python scripts/generate_static.py || echo "⚠️ Static site generation failed (continue)"
          else
            echo "Skip: Outside business hours"
          fi

      - name: Commit and push recovered data
        if: steps.health_check.outputs.issues_found == 'true' || github.event.inputs.force_fetch == 'true'
        run: |
          git config user.name "GitHub Actions (Auto-Recovery)"
          git config user.email "actions@github.com"

          git add data/availability.json docs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(TZ='Asia/Tokyo' date +'%H:%M')
          git commit -m "auto: 自動復旧 ${TIMESTAMP}"

          for i in 1 2 3; do
            git pull origin main --no-rebase -X ours 2>/dev/null || true
            if git push origin main; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 3
          done

      - name: Verify recovery
        if: steps.health_check.outputs.issues_found == 'true' || github.event.inputs.force_fetch == 'true'
        run: |
          echo "🔍 Running health check again to verify recovery..."
          python scripts/health_check.py > health_check_after.txt 2>&1 || true
          cat health_check_after.txt

          if grep -q "ERROR" health_check_after.txt || grep -q "WARNING.*データ未取得" health_check_after.txt; then
            echo "❌ Recovery verification failed - issues still present"
            echo "recovery_status=failed" >> $GITHUB_ENV
            exit 1
          else
            echo "✅ Recovery verified successfully"
            echo "recovery_status=success" >> $GITHUB_ENV
          fi

      - name: Send recovery notification
        if: always() && (steps.health_check.outputs.issues_found == 'true' || github.event.inputs.force_fetch == 'true')
        run: |
          if [ "$recovery_status" = "success" ]; then
            echo "✅ Auto-recovery completed successfully"
            # 通知が必要ならここに追加（WhatsAppなど）
          else
            echo "❌ Auto-recovery failed, manual intervention required"
            # エラー通知が必要ならここに追加
          fi
