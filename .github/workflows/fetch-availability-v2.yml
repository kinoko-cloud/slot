name: Fetch Availability (v2)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-availability-v2.yml'
  schedule:
    # JST 10:00 (開店時 - discovery → fetch)
    - cron: '0 1 * * *'
    # JST 10:30-22:30 (通常fetch)
    - cron: '30 1-13 * * *'
    # JST 11:00-23:00 (通常fetch、営業終了22:45+余裕)
    - cron: '0 2-14 * * *'
  workflow_dispatch:  # 手動実行も可能

concurrency:
  group: slot-fetch-v2
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.49.1

      - name: Install dependencies
        run: |
          pip install 'playwright==1.49.1' requests
          playwright install chromium
          playwright install-deps chromium

      - name: Check unit changes (daily at 10:00)
        if: github.event.schedule == '0 1 * * *'
        run: |
          # 毎日10時に台番号変更をチェック → stores.py自動更新
          echo "=== 台番号チェック開始 ==="
          timeout 300 python scripts/scrapers_v2/fetch_all.py --discover 2>&1 || true
          
          # stores.pyが更新されていたら先にcommit
          if ! git diff --quiet config/stores.py 2>/dev/null; then
            echo "⚠️ 台番号変更を検出 - stores.py更新をcommit"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/stores.py
            git commit -m "auto: 台番号更新 $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "✅ 台番号変更なし"
          fi

      - name: Fetch with v2 scraper (priority stores only)
        run: |
          # ロックファイルをクリア（前回の異常終了対策）
          rm -f /tmp/slot_fetch.lock
          
          # 主要店舗のみ取得（渋谷/新宿/秋葉原）
          echo "=== 主要店舗取得（SBJ）==="
          timeout 300 python scripts/scrapers_v2/fetch_all.py --priority-only --sbj-only 2>&1 || {
            echo "⚠️ SBJ fetch failed"
          }
          
          echo "=== 主要店舗取得（北斗）==="
          timeout 300 python scripts/scrapers_v2/fetch_all.py --priority-only --hokuto-only 2>&1 || {
            echo "⚠️ Hokuto fetch failed"
          }

      - name: Generate static HTML (営業時間中のみ)
        run: |
          HOUR=$(TZ='Asia/Tokyo' date +'%H')
          if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 23 ]; then
            echo "営業時間中 ($HOUR時) - HTML生成"
            pip install jinja2
            timeout 300 python scripts/generate_static.py 2>&1 || {
              echo "⚠️ HTML生成失敗（データ更新は続行）"
            }
          else
            echo "営業時間外 ($HOUR時) - HTML生成スキップ"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/availability.json docs/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(TZ='Asia/Tokyo' date +'%H:%M')
            git commit -m "auto: リアルタイムデータ更新 ${TIMESTAMP}"
            
            # Push with retry (handle concurrent pushes)
            for i in 1 2 3; do
              if git push; then
                echo "✅ Push successful"
                break
              fi
              echo "⚠️ Push failed (attempt $i/3), pulling and retrying..."
              git stash --include-untracked || true
              git pull --rebase origin main
              git stash pop || true
            done
          fi
