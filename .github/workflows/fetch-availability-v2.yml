name: Fetch Availability (v2)

on:
  schedule:
    # JST 10-22時の毎時0分と30分
    - cron: '0 1-13 * * *'
    - cron: '30 1-13 * * *'
  workflow_dispatch:  # 手動実行も可能

concurrency:
  group: slot-fetch-v2
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.49.1

      - name: Install dependencies
        run: |
          pip install 'playwright==1.49.1' requests
          playwright install chromium
          playwright install-deps chromium

      - name: Check unit changes (daily at 10:00)
        if: github.event.schedule == '0 1 * * *'
        run: |
          # 毎日10時に台番号変更をチェック
          timeout 300 python scripts/scrapers_v2/fetch_all.py --discover 2>&1 || true

      - name: Fetch with v2 scraper
        run: |
          # ロックファイルをクリア（前回の異常終了対策）
          rm -f /tmp/slot_fetch.lock
          
          # 全店舗取得（daidata + papimo）
          # - daidata: G数変化なしの台はスキップで高速
          # - papimo: 全台取得（約2分）
          timeout 600 python scripts/scrapers_v2/fetch_all.py 2>&1 || {
            echo "⚠️ Fetch failed or timed out"
            exit 1
          }

      - name: Generate static HTML (営業時間中のみ)
        run: |
          HOUR=$(TZ='Asia/Tokyo' date +'%H')
          if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 22 ]; then
            echo "営業時間中 ($HOUR時) - HTML生成"
            pip install jinja2
            timeout 300 python scripts/generate_static.py 2>&1 || {
              echo "⚠️ HTML生成失敗（データ更新は続行）"
            }
          else
            echo "営業時間外 ($HOUR時) - HTML生成スキップ"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/availability.json docs/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(TZ='Asia/Tokyo' date +'%H:%M')
            git commit -m "auto: リアルタイムデータ更新 ${TIMESTAMP}

Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
            
            # Push with retry (handle concurrent pushes)
            for i in 1 2 3; do
              if git push; then
                echo "✅ Push successful"
                break
              fi
              echo "⚠️ Push failed (attempt $i/3), pulling and retrying..."
              # Stash any unstaged changes before rebase
              git stash --include-untracked || true
              git pull --rebase origin main
              git stash pop || true
            done
          fi
