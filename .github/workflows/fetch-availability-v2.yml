name: Fetch Availability (v2)

on:
  schedule:
    # JST 10-22時の毎時0分と30分
    - cron: '0 1-13 * * *'
    - cron: '30 1-13 * * *'
  workflow_dispatch:

concurrency:
  group: slot-fetch-v2
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.49.1

      - name: Install dependencies
        run: |
          pip install 'playwright==1.49.1' requests
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch with v2 scraper
        run: |
          # 全店舗取得（daidata + papimo）
          # - daidata: G数変化なしの台はスキップで高速
          # - papimo: 全台取得（約2分）
          timeout 600 python scripts/scrapers_v2/fetch_all.py 2>&1 || {
            echo "⚠️ Fetch failed or timed out"
            exit 1
          }

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet data/availability.json; then
            echo "No changes to commit"
          else
            git add data/availability.json
            git commit -m "data: リアルタイムデータ更新 (v2)"
            git push
          fi
