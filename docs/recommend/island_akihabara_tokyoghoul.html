    <script>
        const storeKey = 'island_akihabara_tokyoghoul';
        let currentFilter = 'all';

        function toggleHitDetail(el, e) {
            // イベント伝播を止める（親カードのtoggleDetailsが発火しないように）
            (e || event).stopPropagation();
            const panel = el.nextElementSibling;
            if (panel && panel.classList.contains('hit-detail-panel')) {
                const isHidden = panel.style.display === 'none' || !panel.style.display;
                panel.style.display = isHidden ? 'block' : 'none';
                const icon = el.querySelector('.expand-icon');
                if (icon) icon.textContent = isHidden ? '▲' : '▼';
            }
        }

        function toggleDetails(card) {
            const details = card.querySelector('.unit-details');
            const icon = card.querySelector('.expand-icon');
            if (details) {
                details.classList.toggle('hidden');
                if (icon) {
                    icon.textContent = details.classList.contains('hidden') ? '▼' : '▲';
                }
            }
        }

        function filterUnits(filter) {
            currentFilter = filter;
            const cards = document.querySelectorAll('[data-availability]');
            cards.forEach(card => {
                const avail = card.dataset.availability;
                if (filter === 'all') {
                    card.style.display = '';
                } else if (filter === 'empty') {
                    card.style.display = avail === '空き' ? '' : 'none';
                } else if (filter === 'playing') {
                    card.style.display = avail === '遊技中' ? '' : 'none';
                }
            });

            // ハイライト
            document.querySelectorAll('.availability-summary span').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector('.avail-' + filter)?.classList.add('active');
        }

        // 自動更新（5分ごと）
        setTimeout(function() {
            location.reload();
        }, 5 * 60 * 1000);

    
/* === 共通: 動的モード切替 + 現在時刻 === */
(function() {
    function getJST() {
        var now = new Date();
        return new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    }
    function getDisplayMode() {
        var jst = getJST();
        var h = jst.getHours(), m = jst.getMinutes();
        if (h < 10) return 'before_open';
        if (h >= 23 || (h === 22 && m >= 50)) return 'after_close';
        return 'realtime';
    }
    function updateModeBadge() {
        var mode = getDisplayMode();
        var badge = document.querySelector('.mode-badge');
        if (!badge) return;
        badge.className = 'mode-badge';
        if (mode === 'before_open') {
            badge.classList.add('before-open');
            badge.textContent = '🌙 営業前';
        } else if (mode === 'after_close') {
            badge.classList.add('after-close');
            badge.textContent = '🔒 閉店後';
        } else {
            badge.classList.add('realtime');
            badge.textContent = '🟢 営業中';
        }
    }
    function updateCurrentTime() {
        var jst = getJST();
        var hh = String(jst.getHours()).padStart(2, '0');
        var mi = String(jst.getMinutes()).padStart(2, '0');
        var el = document.getElementById('current-time');
        if (el) el.textContent = hh + ':' + mi;
    }
    updateModeBadge();
    updateCurrentTime();
    setInterval(function() {
        updateModeBadge();
        updateCurrentTime();
    }, 60000);
})();
    </script>
