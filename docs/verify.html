    <script>
    function toggleDetail(rowEl) {
        var detailRow = rowEl.nextElementSibling;
        if (!detailRow || !detailRow.classList.contains('verify-detail-row')) return;

        var isHidden = detailRow.classList.contains('hidden');
        var table = rowEl.closest('.verify-table');
        if (table) {
            table.querySelectorAll('.verify-detail-row').forEach(function(d) { d.classList.add('hidden'); });
            table.querySelectorAll('.verify-row').forEach(function(r) { r.classList.remove('expanded'); });
        }

        if (isHidden) {
            detailRow.classList.remove('hidden');
            rowEl.classList.add('expanded');
        }
    }
    
/* === 共通: 動的モード切替 + 現在時刻 === */
(function() {
    function getJST() {
        var now = new Date();
        return new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    }
    function getDisplayMode() {
        var jst = getJST();
        var h = jst.getHours(), m = jst.getMinutes();
        if (h < 10) return 'before_open';
        if (h >= 23 || (h === 22 && m >= 50)) return 'after_close';
        return 'realtime';
    }
    function updateModeBadge() {
        var mode = getDisplayMode();
        var badge = document.querySelector('.mode-badge');
        if (!badge) return;
        badge.className = 'mode-badge';
        if (mode === 'before_open') {
            badge.classList.add('before-open');
            badge.textContent = '🌙 営業前';
        } else if (mode === 'after_close') {
            badge.classList.add('after-close');
            badge.textContent = '🔒 閉店後';
        } else {
            badge.classList.add('realtime');
            badge.textContent = '🟢 営業中';
        }
    }
    function updateCurrentTime() {
        var jst = getJST();
        var hh = String(jst.getHours()).padStart(2, '0');
        var mi = String(jst.getMinutes()).padStart(2, '0');
        var el = document.getElementById('current-time');
        if (el) el.textContent = hh + ':' + mi;
    }
    updateModeBadge();
    updateCurrentTime();
    setInterval(function() {
        updateModeBadge();
        updateCurrentTime();
    }, 60000);
})();
    </script>
